<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgmi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04090d"/>
      <stop offset="50%" stop-color="#0a151e"/>
      <stop offset="100%" stop-color="#0f2130"/>
    </linearGradient>
    <linearGradient id="bgmi-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="bgmi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="bgmi-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#006699" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bgmi-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00e5ff" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="1280" height="720" fill="url(#bgmi-bg)"/>
  <rect width="1280" height="720" fill="url(#bgmi-dots)"/>
  <circle cx="640" cy="350" r="500" fill="url(#bgmi-glow)"/>

  <!-- Tactical map contour lines -->
  <path d="M 0,200 Q 320,100 640,240 T 1280,180" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M 0,380 Q 400,280 800,420 T 1280,360" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M 0,540 Q 300,600 700,500 T 1280,560" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Slanted tactical stripes -->
  <polygon points="180,0 260,0 120,720 40,720" fill="#00e5ff" fill-opacity="0.04"/>
  <polygon points="1100,0 1180,0 1040,720 960,720" fill="#f59e0b" fill-opacity="0.04"/>

  <!-- Radar circle in center -->
  <g transform="translate(640, 230)">
    <circle cx="0" cy="0" r="130" fill="#06131c" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Crosshairs -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Airdrop crate icon in center -->
    <g transform="translate(-32, -32)">
      <!-- Crate box top/red canvas -->
      <rect x="4" y="4" width="56" height="24" rx="3" fill="#dc2626"/>
      <!-- Crate blue base -->
      <rect x="4" y="28" width="56" height="32" rx="3" fill="#2563eb"/>
      <!-- Straps/harness -->
      <line x1="20" y1="4" x2="20" y2="60" stroke="#f59e0b" stroke-width="4"/>
      <line x1="44" y1="4" x2="44" y2="60" stroke="#f59e0b" stroke-width="4"/>
      <line x1="4" y1="28" x2="60" y2="28" stroke="#111827" stroke-width="2"/>
    </g>

    <!-- Signal flare smoke ping -->
    <circle cx="65" cy="-55" r="7" fill="#fbbf24"/>
    <circle cx="65" cy="-55" r="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="78" y="-51" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="bold">DROP#01</text>
  </g>

  <!-- Big title -->
  <text x="640" y="440" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    BGMI
  </text>

  <!-- Subtitle -->
  <text x="640" y="475" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#00e5ff" text-anchor="middle" letter-spacing="6">
    BATTLEGROUNDS MOBILE INDIA
  </text>

  <!-- Tagline badge -->
  <rect x="430" y="495" width="420" height="34" rx="17" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="640" y="517" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#e0f7fa" text-anchor="middle" letter-spacing="3">
    CLASSIC ERANGEL • SQUAD CHAMPIONSHIP
  </text>

  <!-- Telemetry marks -->
  <g transform="translate(100, 120)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#00e5ff" fill-opacity="0.7">COORD: 43.19° N, 12.44° E</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#00e5ff" fill-opacity="0.5">MAP: ERANGEL 8x8 KM</text>
    <rect x="-10" y="-14" width="4" height="36" fill="#00e5ff"/>
  </g>

  <g transform="translate(1100, 600)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#f59e0b" fill-opacity="0.7" text-anchor="end">ZONE: PHASE 4</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#f59e0b" fill-opacity="0.5" text-anchor="end">SURVIVORS: 16 TEAMS</text>
    <rect x="6" y="-14" width="4" height="36" fill="#f59e0b"/>
  </g>
</svg>
